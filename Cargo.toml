[package]
name = "fht-share-picker"
version = "0.2.0"
authors = ["Nadjib Ferhat <nadjib.ferhat@etu.usthb.dz>"]
license = "GPL-3.0"
edition = "2021"
repository = "https://github.com/nferhat/fht-share-picker"

[profile.release]
lto = true

[dependencies]
adw = { version = "0.7.1", package = "libadwaita", features = ["v1_6"] }
glib = { version = "0.20.7", features = ["log"] }
gtk = { version = "0.9", package = "gtk4", features = ["v4_16"] }
sctk = { package = "smithay-client-toolkit", git = "https://github.com/smithay/client-toolkit" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
tracing = "0.1.37"
tracing-subscriber = "0.3"

[build-dependencies]
glib-build-tools = "0.20.0"
